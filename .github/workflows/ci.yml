name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-components
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui-components
      - name: Checkout unpublished core source (immutable)
        uses: actions/checkout@v4
        with:
          repository: CoderLifeNet/ui-core
          ref: 6435126083f6b5e3aceb40ba6b9b2f1a87f171c2
          path: ui-core
          persist-credentials: false
          # Public core needs no secret. For private core, provide a read-only
          # cross-repository token as CORE_READ_TOKEN (GITHUB_TOKEN is repo-scoped).
          token: ${{ secrets.CORE_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build core tarball from pinned source
        working-directory: ui-core
        run: |
          pnpm install --frozen-lockfile
          pnpm check:generated
          pnpm pack:local
      - name: Bind local artifact integrity without resolving new registry versions
        run: node scripts/prepare-artifacts.mjs --root
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:acceptance
      - run: node ../ui-core/scripts/check-release.mjs --dry-run
